<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Harvex Employee Login</title><link rel="stylesheet" href="/styles.css"></head><body class="portal-body"><main class="login-wrap"><section class="login-card"><a class="brand" href="/"><span class="brand-mark">H</span><span>HARVEX<br><small>LAWN CARE</small></span></a><br><p class="eyebrow">EMPLOYEE PORTAL</p><h1>Sign in.</h1><p>Owners and employees use the same secure login. Your access level determines what you can see.</p><form id="login-form"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button primary" type="submit">Sign In</button><p id="login-message" class="form-message"></p></form><a class="portal-link" href="/">← Back to Harvex</a></section></main><script>const f=document.getElementById('login-form');const m=document.getElementById('login-message');f.addEventListener('submit',async e=>{e.preventDefault();m.textContent='Signing in…';m.style.color='#4e765c';try{const data=Object.fromEntries(new FormData(f).entries());const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Login failed.');location.href=j.redirect||'/employee-directory.html'}catch(err){m.textContent=err.message;m.style.color='#a53b32'}});</script></body></html>
